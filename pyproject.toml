[project]
name = "taxdome-payments"
version = "0.1.0"
description = "Bulk firm payment service for the TaxDome technical challenge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "case(*ids): catalogue case IDs covered by the test",
    "slow: test takes several seconds",
]
