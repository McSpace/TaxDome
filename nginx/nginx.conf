worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{"ts":"$time_iso8601","request_id":"$correlation_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","request_time":$request_time}';
    access_log /dev/stdout json;

    # Keep a caller-supplied correlation ID; otherwise generate one.
    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Round-robin over three identical instances (the nginx default balancing method).
    upstream api {
        server api-1:8000;
        server api-2:8000;
        server api-3:8000;
        keepalive 32;
        # Close idle upstream connections before uvicorn does (5 s), so a request is never
        # written onto a socket the API is closing.
        keepalive_timeout 4s;
    }

    server {
        listen 8080;

        # Same 1 MiB limit as the API; nginx answers 413 itself with the JSON envelope.
        client_max_body_size 1m;
        error_page 413 = @request_too_large;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Fail over only when an instance cannot be reached. Without the non-idempotent flag, nginx
            # never passes a POST to another instance once any of it was sent to the first one,
            # because that payment may already be committed (and OFF mode would pay twice).
            proxy_next_upstream error timeout;

            proxy_connect_timeout 5s;
            # Longer than the database statement timeout (15 s) so the API answers first.
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @request_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"request_too_large","message":"Request body exceeds 1 MiB."}}';
        }
    }
}
