name: taxdome

x-app-image: &app-image
  image: taxdome-app:local
  build:
    context: .
    target: runtime

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taxdome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxdome"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    <<: *app-image
    command: ["python", "-m", "app.migrate"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres-dev-password}@postgres:5432/taxdome
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-dev-password}
      # Only an unset variable defaults to "on"; an empty or malformed value fails initialization.
      PAYMENT_IDEMPOTENCY_MODE: ${PAYMENT_IDEMPOTENCY_MODE-on}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1: &api
    <<: *app-image
    environment: &api-env
      INSTANCE_ID: api-1
      DATABASE_URL: postgresql://payments_api:${API_DB_PASSWORD:-api-dev-password}@postgres:5432/taxdome
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: unless-stopped

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  api-3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-3

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
